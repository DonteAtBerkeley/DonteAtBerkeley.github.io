<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
          <span class="brand-mark" aria-hidden="true">P</span>
          <span>{{ site.title }}</span>
        </a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Change color theme" aria-pressed="false">
          <span class="theme-toggle-label" data-theme-label>Use dark mode</span>
        </button>
        <nav class="primary-nav" aria-label="Primary navigation">
          <ul>
            {% for item in site.navigation %}
            <li>
              <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
            </li>
            {% endfor %}
          </ul>
        </nav>
      </div>
    </header>
    <main id="main-content">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  </body>
</html>
